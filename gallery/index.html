<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Qwen Anime Lab</title>
<style>
:root {
  --bg: #f6f4ef; --panel: #ffffff; --ink: #1d1b22; --muted: #6b6775; --line: #e2ded5;
  --accent: #d6336c; --accent-soft: #fbe3ec; --add: #1f7a4a; --add-bg: #dff3e7; --del: #a8321f; --del-bg: #f8e1dc;
  --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14131a; --panel: #1d1c25; --ink: #ecebf2; --muted: #9a97a8; --line: #2e2c38;
    --accent: #ff6b9a; --accent-soft: #3a1f2b; --add: #6fdc9d; --add-bg: #173424; --del: #ff9480; --del-bg: #3a1c17;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"] {
  --bg: #14131a; --panel: #1d1c25; --ink: #ecebf2; --muted: #9a97a8; --line: #2e2c38;
  --accent: #ff6b9a; --accent-soft: #3a1f2b; --add: #6fdc9d; --add-bg: #173424; --del: #ff9480; --del-bg: #3a1c17;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.3);
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.sbtns { display: inline-flex; gap: 2px; margin-left: 6px; vertical-align: middle; }
.sbtn { font-size: 12px; line-height: 1; padding: 2px 5px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; opacity: .55; }
.sbtn:hover { opacity: 1; }
.sbtn.on { opacity: 1; border-color: var(--accent); background: var(--accent-soft, rgba(127,127,127,.15)); }
.strip.s-love > .shead { box-shadow: inset 3px 0 0 #e0557a; padding-left: 6px; }
.strip.s-nope > .shead { opacity: .6; }
.tnode.s-love { outline: 2px solid #e0557a; outline-offset: 1px; }
.tnode.s-nope { opacity: .6; }
.gsheets { margin: 0 0 18px; }
.gsheets h3, .chdetail h3 { margin: 4px 0 8px; font-size: 16px; }
.gsheets h3 .sub, .chdetail .sub { font-weight: 400; color: var(--muted); font-size: 12px; margin-left: 6px; }
.chgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.chtile { display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; color: var(--ink); }
.chtile:hover { border-color: var(--accent); text-decoration: none; }
.chtile img { width: 100%; aspect-ratio: 3/4; object-fit: cover; display: block; }
.chcap { padding: 6px 8px; display: flex; flex-direction: column; gap: 2px; font-size: 13px; }
.chcap span { color: var(--muted); font-size: 11.5px; }
.chall { margin-top: 18px !important; }
.chdetail h4 { margin: 16px 0 6px; font-size: 14px; }
.shmore { margin-top: 6px; } .shmore summary { cursor: pointer; color: var(--muted); font-size: 12.5px; } .shmore .shcells { margin-top: 6px; opacity: .8; }
.chprog { font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); margin-left: 6px; }
.chprog.done { background: var(--add); border-color: var(--add); color: #fff; }
.chback { display: inline-block; margin-bottom: 6px; }
.shcells { display: flex; gap: 10px; flex-wrap: wrap; }
.shcell { margin: 0; width: 200px; display: flex; flex-direction: column; gap: 4px; }
.shcell img { width: 100%; aspect-ratio: 1; object-fit: cover; object-position: top; border-radius: 8px; cursor: zoom-in; background: #ddd; }
.shcell figcaption { font-size: 12px; color: var(--muted); }
.shcell figcaption span { opacity: .7; }
.pincount { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; white-space: nowrap; }
.pincount input { width: 46px; }
.refit { display: inline-flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.refit select { font-size: 12px; }
.refit a { font-size: 12px; }
.fitwait { font-size: 12px; color: var(--accent); }
.upfit { position: absolute; left: 5px; top: 5px; font-size: 11px; font-weight: 700; padding: 1px 5px; border-radius: 4px; background: rgba(0,0,0,.6); color: #fff; pointer-events: auto; }
select[data-fsel].on { border-color: var(--accent); color: var(--accent); }
/* lightbox action buttons, lightly colour-coded by what they do (user 2026-09-27: "color code the buttons slightly when viewing
   the enlarged images"): a faint tint + coloured border, stronger when on */
#lightbox .lbfb button, #lightbox .lbfb a.upb { --c: 128,128,128; background: linear-gradient(rgba(var(--c), .32), rgba(var(--c), .32)), #2a2833;
  border: 1px solid rgba(var(--c), .9); color: #fff; }
#lightbox .lbfb button:hover, #lightbox .lbfb a.upb:hover { background: linear-gradient(rgba(var(--c), .5), rgba(var(--c), .5)), #2a2833; }
#lightbox .lbfb button.on, #lightbox .lbfb a.upb.on { background: rgb(var(--c)); border-color: rgb(var(--c)); color: #fff; }
#lightbox .lbfb .pinb { --c: 214,166,52; }                       /* evolve / cross: gold */
#lightbox .lbfb .rerollb { --c: 70,130,220; }                    /* re-render: blue */
#lightbox .lbfb .upb, #lightbox .lbfb [data-refit] { --c: 32,170,170; }    /* upscale / refit: teal */
#lightbox .lbfb [data-fb="love"] { --c: 226,80,122; }            /* love: pink */
#lightbox .lbfb [data-fb="nope"] { --c: 150,150,150; }           /* nope: grey */
#lightbox .lbfb [data-fb="animate"] { --c: 150,90,220; }         /* animate: violet */
#lightbox .lbfb [data-fb="cast"] { --c: 70,170,90; }             /* more characters: green */
#lightbox .lbfb .exploreb { --c: 230,130,40; }                   /* journey: orange */
#lightbox .lbfb .blurb { --c: 110,120,140; }                     /* blur: slate */
#lightbox .lbfb [data-jref] { --c: 150,110,70; }                 /* journey reference: brown */
header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 16px; padding: 12px 24px; flex-wrap: wrap; }
header h1 { font-size: 18px; margin: 0; letter-spacing: .02em; }
header h1 span { color: var(--accent); }
header .stats { color: var(--muted); font-size: 13px; }
header .spacer { flex: 1; }
button, .chip { font: inherit; font-size: 13px; border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  border-radius: 999px; padding: 4px 12px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
main { padding: 20px 24px 120px; }
.round-head { display: flex; align-items: baseline; gap: 12px; margin: 28px 0 12px; flex-wrap: wrap; }
.round-head h2 { margin: 0; font-size: 20px; }
.round-head .sub { color: var(--muted); font-size: 13px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; box-shadow: var(--shadow);
  display: flex; flex-direction: column; cursor: pointer; transition: transform .12s; }
.card:hover { transform: translateY(-2px); border-color: var(--accent); }
.card .thumbs { display: grid; grid-auto-flow: column; gap: 2px; background: var(--line); }
.card .thumbs img { width: 100%; aspect-ratio: 3/4; object-fit: cover; display: block; }
.card .body { padding: 10px 12px 12px; }
.card .id { font: 12px ui-monospace, Consolas, monospace; color: var(--muted); }
.card h3 { margin: 2px 0 4px; font-size: 15px; }
.card .meta { font-size: 12px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; }
.verdict { font-size: 13px; margin-top: 6px; padding: 6px 8px; border-left: 3px solid var(--accent); background: var(--accent-soft); border-radius: 4px; }
.verdict:empty { display: none; }
.grid-wrap { overflow-x: auto; }
table.sgrid { border-collapse: separate; border-spacing: 6px; width: 100%; table-layout: fixed; }
table.sgrid th { font-size: 12px; font-weight: 600; text-align: left; vertical-align: bottom; padding: 0 2px; overflow-wrap: anywhere; }
table.sgrid th a { color: var(--ink); }
table.sgrid td img { width: 100%; aspect-ratio: 3/4; object-fit: cover; border-radius: 6px; display: block; cursor: zoom-in; }
table.sgrid td.rowlabel { font: 12px ui-monospace, Consolas, monospace; color: var(--muted); writing-mode: vertical-rl; transform: rotate(180deg); }
.crumbs { font-size: 13px; color: var(--muted); margin-bottom: 4px; }
.lin-head h2 { margin: 0 0 4px; font-size: 24px; }
.lin-head .goal { color: var(--muted); max-width: 800px; }
.rel { font-size: 13px; margin-top: 8px; display: flex; gap: 12px; flex-wrap: wrap; }
.version { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow);
  margin: 20px 0; display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); overflow: hidden; }
@media (max-width: 900px) { .version { grid-template-columns: 1fr; } }
.version .imgs { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(var(--tile), 100%), 1fr)); gap: 4px; padding: 4px; background: var(--line); }
.imgbox { position: relative; }
.imgbox img { width: 100%; display: block; border-radius: 6px; cursor: zoom-in; }
.imgbox .cap { position: absolute; left: 6px; top: 6px; font: 11px ui-monospace, Consolas, monospace; background: rgba(0,0,0,.6); color: #fff; padding: 1px 6px; border-radius: 4px; }
.imgbox .pin { position: absolute; right: 6px; top: 6px; padding: 2px 8px; font-size: 12px; background: rgba(0,0,0,.55); color: #fff; border-color: transparent; }
.imgbox .pin.on { background: var(--accent); }
.version .info { padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.vtitle { display: flex; align-items: baseline; gap: 10px; }
.vtitle b { font: 700 18px ui-monospace, Consolas, monospace; color: var(--accent); }
.label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.prompt { font-size: 13.5px; line-height: 1.6; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; white-space: pre-wrap; }
.prompt ins { text-decoration: none; background: var(--add-bg); color: var(--add); border-radius: 3px; padding: 0 1px; }
.prompt del { background: var(--del-bg); color: var(--del); border-radius: 3px; padding: 0 1px; }
.params { display: flex; flex-wrap: wrap; gap: 6px; }
.params span { font: 12px ui-monospace, Consolas, monospace; border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; }
.params span.changed { border-color: var(--add); color: var(--add); background: var(--add-bg); }
.difftoggle { align-self: flex-start; }
.chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
#tray { position: fixed; left: 0; right: 0; bottom: 0; background: var(--panel); border-top: 1px solid var(--line); padding: 8px 24px;
  display: none; align-items: center; gap: 10px; z-index: 6; box-shadow: 0 -4px 16px rgba(0,0,0,.12); }
#tray.show { display: flex; }
#tray .pins { display: flex; gap: 6px; overflow-x: auto; flex: 1; }
#tray .pins img { height: 56px; border-radius: 4px; cursor: pointer; }
#tray .pins img:hover { opacity: .5; }
#tray #pindir { flex: 1.2; min-width: 180px; max-width: 520px; font: inherit; font-size: 13px; resize: vertical; background: var(--bg); color: var(--fg);
  border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
#tray #pinsubmit { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
@media (max-width: 700px) { #tray { flex-wrap: wrap; padding: 8px 16px; } #tray #pindir { flex-basis: 100%; max-width: none; } }
.fbbar button.rerollb.on, .lbfb button.rerollb.on { background: var(--accent); color: #fff; animation: rrpulse 1s ease-in-out infinite alternate; }
@keyframes rrpulse { to { opacity: .55; } }
.fbbar button.pinb.on { background: var(--accent); color: #fff; }
.overlay { position: fixed; inset: 0; background: rgba(8,8,12,.92); z-index: 10; display: none; }
.overlay.show { display: flex; }
#lightbox { align-items: center; justify-content: center; flex-direction: column; gap: 10px; }
#lightbox img { max-width: 94vw; max-height: 62vh; border-radius: 6px; }
#lightbox .lbcap { color: #ddd; font-size: 13px; text-align: center; }
#lightbox .nav { position: absolute; top: 50%; transform: translateY(-50%); font-size: 28px; background: none; border: none; color: #fff; padding: 20px; }
#lightbox .prev { left: 8px; } #lightbox .next { right: 8px; }
.overlay .close { position: absolute; top: 12px; right: 16px; background: none; border: none; color: #fff; font-size: 26px; }
#compare { flex-direction: column; padding: 48px 16px 16px; }
#compare .cmp { flex: 1; display: grid; gap: 8px; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); min-height: 0; }
#compare figure { margin: 0; display: flex; flex-direction: column; min-height: 0; }
#compare figure img { flex: 1; min-height: 0; width: 100%; object-fit: contain; }
#compare figcaption { color: #ddd; font-size: 12px; text-align: center; padding-top: 4px; }
.cell { position: relative; }
/* hover bar: confined to its own image (user 2026-09-25: buttons bled over neighbouring images). It may never be wider
   than the tile: it wraps upward inside it, and on narrow tiles only ❤ 👎 + ⋯ (opens the full labelled bar) are shown */
.cell, .imgbox { container-type: inline-size; }
.fbbar { position: absolute; left: 6px; right: 6px; bottom: 6px; display: flex; flex-wrap: wrap-reverse; justify-content: flex-end;
  align-content: flex-start; gap: 4px; opacity: 0; transition: opacity .12s; z-index: 2; pointer-events: none; }
.fbbar > *, .fbbar .sec > * { pointer-events: auto; }
.fbbar .sec { display: contents; }
.fbbar .moreb { display: none; }
@container (max-width: 250px) {
  .fbbar .sec { display: none; }
  .fbbar .moreb { display: inline-block; }
  .fbbar.marked .sec { display: contents; }
  .fbbar.marked .sec button:not(.on) { display: none !important; }
}
.cell:hover .fbbar, .imgbox:hover .fbbar, .fbbar.marked { opacity: 1; }
.fbbar button { padding: 2px 7px; font-size: 13px; background: rgba(0,0,0,.6); color: #fff; border-color: transparent; }
.fbbar button.on { background: var(--accent); }
.fbbar.marked button:not(.on) { display: none; }
.cell:hover .fbbar.marked button, .imgbox:hover .fbbar.marked button { display: inline-block; }
.fbstat { position: absolute; left: 6px; bottom: 6px; font-size: 11px; background: rgba(0,0,0,.65); color: #fff; padding: 1px 6px; border-radius: 4px;
  white-space: nowrap; z-index: 1; cursor: help; }
.cell:hover .fbstat, .imgbox:hover .fbstat { opacity: .35; }
#sendfb { display: none; } #sendfb.show { display: inline-block; background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
#fbwait { font-size: 12px; color: var(--muted); }
.lbfb { display: flex; flex-direction: column; gap: 6px; align-items: center; width: min(640px, 94vw); }
.lbfb .row { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.lbfb button { background: #2a2833; color: #fff; border-color: #444; }
.lbfb button.on { background: var(--accent); border-color: var(--accent); }
.lbfb textarea { width: 100%; min-height: 44px; border-radius: 8px; border: 1px solid #444; background: #1b1a22; color: #eee; font: 13px system-ui, sans-serif; padding: 6px 8px; resize: vertical; }
.lbfb .reply { color: #9fe0b8; font-size: 13px; }
.lbfb .hint { color: #999; font-size: 12px; }
.lbthread { width: 100%; max-height: 26vh; overflow-y: auto; }
.lbthread .msg { background: #1b1a22; border-color: #3a3846; color: #eee; }
.lbthread .msg.claude { background: #16301f; border-color: #3f8f5f; }
.lbthread textarea { background: #1b1a22; color: #eee; border-color: #444; }
.lbthread .who, .lbthread .awaiting { color: #aaa; }
.vbadge { position: absolute; left: 6px; top: 6px; font: 11px ui-monospace, Consolas, monospace; background: rgba(0,0,0,.65); color: #fff; padding: 1px 6px; border-radius: 4px; }
.pending { display: grid; place-items: center; text-align: center; aspect-ratio: 3/4; min-width: 0; border: 1px dashed var(--muted);
  border-radius: 6px; color: var(--muted); font-size: 12px; background: var(--panel); }
table.sgrid td .cell { position: relative; }
.empty { color: var(--muted); padding: 40px 0; }
:root { --tile: 200px; --hdr: 52px; }
.toolbar { position: sticky; top: var(--hdr); z-index: 4; background: var(--bg); display: flex; gap: 6px; align-items: center;
  flex-wrap: wrap; padding: 8px 0; margin: -8px 0 4px; border-bottom: 1px solid var(--line); }
.sizer { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); font-size: 12px; margin-right: 6px; }
.sizer input { width: 130px; accent-color: var(--accent); }
.groups { display: flex; flex-wrap: wrap; gap: 6px 28px; align-items: flex-start; }
.group { max-width: 100%; min-width: 0; }
.group .round-head { width: 0; min-width: 100%; margin: 14px 0 8px; flex-wrap: nowrap; }
.group .round-head h2 { white-space: nowrap; }
.group .round-head .sub { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.group.evset { margin: 10px 0; }
.group .evhead { width: 0; min-width: 100%; }
.lead { display: flex; gap: 10px; align-items: stretch; max-width: 100%; }
.lead > .strip { min-width: 0; }
.layer-head { margin-bottom: 14px; }
.imgflow { gap: 6px; }
.vidchip { position: absolute; right: 6px; top: 32px; font-size: 12px; font-weight: 600; background: #ff9f43; color: #1d1b22 !important;
  padding: 1px 8px; border-radius: 999px; box-shadow: 0 1px 4px rgba(0,0,0,.4); }
.vidchip:hover { text-decoration: none; filter: brightness(1.1); }
.vtile video { width: 100%; aspect-ratio: 3/4; object-fit: cover; border-radius: 6px; display: block; cursor: zoom-in; background: #000; }
.vstrip .tiles, .vstrip .vtile { width: var(--tile); }
.vstrip { width: calc(var(--tile) + 12px); }
#lightbox .lbvid { max-width: 94vw; max-height: 62vh; border-radius: 6px; background: #000; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.seg button { border: 0 !important; border-radius: 0 !important; padding: 4px 10px; }
.seg button + button { border-left: 1px solid var(--line) !important; }
.toolbar select { font: inherit; font-size: 13px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 999px; padding: 4px 10px; max-width: 180px; }
.castbox { position: relative; }
.castbox input { font: inherit; font-size: 13px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 999px; padding: 4px 12px; width: 210px; }
.castbox input:focus { outline: none; border-color: var(--accent); width: 280px; }
.castlist { display: none; position: absolute; z-index: 30; top: calc(100% + 4px); left: 0; width: 380px; max-width: calc(100vw - 32px); max-height: 60vh; overflow-y: auto;
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 4px; font-size: 13px; }
.castlist.show { display: block; }
.copt { padding: 6px 9px; border-radius: 7px; cursor: pointer; }
.copt.sel { background: var(--accent-soft); }
.copt.cur b::after { content: " ✓"; color: var(--accent); }
.copt .cn { color: var(--muted); font-size: 11px; }
.copt .ch { color: var(--muted); font-size: 12px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.copt mark { background: none; color: var(--accent); font-weight: 600; }
.copt.none { color: var(--muted); cursor: default; }
.fdrop { position: relative; }
.fdrop summary { list-style: none; cursor: pointer; font-size: 13px; border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 4px 12px; user-select: none; }
.fdrop summary::-webkit-details-marker { display: none; }
.fdrop summary b { background: var(--accent); color: #fff; border-radius: 999px; padding: 0 6px; font-size: 11px; }
.fdrop .fmenu { position: absolute; z-index: 20; top: calc(100% + 4px); left: 0; background: var(--panel); border: 1px solid var(--line);
  border-radius: 10px; padding: 8px 10px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 6px; white-space: nowrap; font-size: 13px; }
.pill { background: var(--accent-soft) !important; border-color: var(--accent) !important; color: var(--accent) !important; padding: 2px 10px !important; }
.clearf { border-color: var(--accent) !important; color: var(--accent) !important; }
.reveal { background: none; border: 0; padding: 0 2px; cursor: pointer; font-size: 13px; opacity: .7; } .reveal:hover { opacity: 1; }
.lbfb .reveal { font-size: 13px; opacity: 1; }
.sdate { font: 10.5px ui-monospace, Consolas, monospace; color: var(--accent); white-space: nowrap; margin-right: 2px; }
select[data-sort] { font: inherit; font-size: 13px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 999px; padding: 4px 10px; }
.rmark { align-self: stretch; display: flex; align-items: center; justify-content: center; padding: 8px 5px; border-radius: 10px;

function diffWords(a, b) {
  const A = a.split(/(\s+)/), B = b.split(/(\s+)/);
  const n = A.length, m = B.length, L = Array.from({length: n + 1}, () => new Uint16Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    L[i][j] = A[i] === B[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  let i = 0, j = 0, out = "";
  while (i < n && j < m) {
    if (A[i] === B[j]) { out += esc(A[i]); i++; j++; }
    else if (L[i + 1][j] >= L[i][j + 1]) out += `<del>${esc(A[i++])}</del>`;
    else out += `<ins>${esc(B[j++])}</ins>`;
  }
  while (i < n) out += `<del>${esc(A[i++])}</del>`;
  while (j < m) out += `<ins>${esc(B[j++])}</ins>`;
  return out.replace(/<\/del><del>/g, "").replace(/<\/ins><ins>/g, "");
}

    const node = {id: "img:" + key, src: key, lin: pl, ver: pv, label: pslot ? pslot.label : pv,
      title: plin ? plin.title : pl, depth: plin ? (plin.depth || 0) : 0,
      change: plin?.versions.find(v => v.id === pv)?.notes.change || "", gen};

    if (!childLins.length) break;

$("#menubtn").onclick = () => { $("header").classList.toggle("open"); syncHdr(); };
const addTbToggles = () => document.querySelectorAll(".toolbar").forEach(tb => {
  if (tb.querySelector(".tbtoggle")) return;
  const b = document.createElement("button"); b.className = "tbtoggle mobonly"; b.textContent = "⚙ Filters";
  b.onclick = e => { e.preventDefault(); document.body.classList.toggle("tbopen"); syncHdr(); };
  tb.prepend(b);
});
new MutationObserver(addTbToggles).observe($("#app"), {childList: true, subtree: true});
const syncHdr = () => { const r = document.documentElement.style, g = document.querySelector(".gnav");
  r.setProperty("--hdr", document.querySelector("header").offsetHeight + "px");
  if (g) r.setProperty("--gnavh", g.offsetHeight + "px"); };
syncHdr(); window.addEventListener("resize", syncHdr);
document.body.classList.toggle("compact", tileSize() < 150);
{
  const q = $("#q"); q.value = store.get("q", "");
  let tmr;
  q.addEventListener("input", () => { clearTimeout(tmr); tmr = setTimeout(() => { store.set("q", q.value); render(); }, 150); });
  let gtmr;
  document.addEventListener("input", e => {
    if (e.target.id !== "gq") return;
    clearTimeout(gtmr);
    gtmr = setTimeout(() => {
      const v = e.target.value, pos = e.target.selectionStart;
      store.set("gq", v); render(true, true);
      const el = $("#gq"); if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch {} }
    }, 150);
  });
  q.addEventListener("keydown", e => { if (e.key === "Escape") { q.value = ""; store.set("q", ""); render(); q.blur(); } });
  document.addEventListener("keydown", e => {
    if (e.key === "/" && !/INPUT|TEXTAREA/.test(document.activeElement?.tagName || "") && !document.querySelector(".overlay.show")) { e.preventDefault(); q.focus(); q.select(); }
  });
}
document.addEventListener("click", e => {  // clicking anywhere outside an open Filters dropdown closes it
  document.querySelectorAll("details.fdrop[open]").forEach(d => { if (!d.contains(e.target)) { d.open = false; fdropOpen = false; } });
  document.querySelectorAll("details.evodd[open]").forEach(d => { if (!d.contains(e.target) || e.target.closest(".evomenu a")) d.open = false; });
});
window.addEventListener("hashchange", () => { document.querySelectorAll(".overlay").forEach(o => o.classList.remove("show")); render(); });
render(); paintPins();
if (canFB) { fbLoad(); cmLoad(); pinLoad(); qLoad(); blLoad(); jLoad(); setInterval(() => { if (document.hidden) return; fbLoad(); cmLoad(); pinLoad(); qLoad(); blLoad(); jLoad(); }, 3000); }
else { $("#qbtn").style.display = "none"; $("#cmbtn").style.display = "none"; }

// live updates: when served over http, poll data.json and redraw in place on change
const live = $("#live");
if (location.protocol.startsWith("http")) {
  let last = JSON.stringify(RAW), stamp = "";
  live.classList.add("on"); live.title = "Auto-updating: new renders appear within a few seconds";
  setInterval(async () => {
    if (document.hidden) return;  // no polling in a background tab
    try {
      // cheap HEAD first: the 2.4 MB data.json is only downloaded + parsed when it actually changed
      const h = await fetch("data.json", {method: "HEAD", cache: "no-store"});
      const st = (h.headers.get("last-modified") || "") + "|" + (h.headers.get("content-length") || "");
      live.classList.add("on");
      if (st && st === stamp) return;
      const txt = JSON.stringify(await (await fetch("data.json", {cache: "no-store"})).json());
      stamp = st;
      if (txt === last) return;
      const next = JSON.parse(txt);
      if (next.ui !== RAW.ui) { if (mediaPlaying()) PENDING_RELOAD = true; else location.reload(); return; }  // gallery code changed
      last = txt; setData(next);
      const y = window.scrollY; render(true); window.scrollTo(0, y);
    } catch { live.classList.remove("on"); live.title = "Gallery server not reachable"; }
  }, 4000);
} else {
  live.style.opacity = .5;
  live.title = "Opened as a file, so no live updates. Run tools/serve_gallery.py and use http://127.0.0.1:8765/gallery/";
}
