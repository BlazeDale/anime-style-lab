<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Qwen Anime Lab</title>
<style>
:root {
  --bg: #f6f4ef; --panel: #ffffff; --ink: #1d1b22; --muted: #6b6775; --line: #e2ded5;
  --accent: #d6336c; --accent-soft: #fbe3ec; --add: #1f7a4a; --add-bg: #dff3e7; --del: #a8321f; --del-bg: #f8e1dc;
  --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14131a; --panel: #1d1c25; --ink: #ecebf2; --muted: #9a97a8; --line: #2e2c38;
    --accent: #ff6b9a; --accent-soft: #3a1f2b; --add: #6fdc9d; --add-bg: #173424; --del: #ff9480; --del-bg: #3a1c17;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"] {
  --bg: #14131a; --panel: #1d1c25; --ink: #ecebf2; --muted: #9a97a8; --line: #2e2c38;
  --accent: #ff6b9a; --accent-soft: #3a1f2b; --add: #6fdc9d; --add-bg: #173424; --del: #ff9480; --del-bg: #3a1c17;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.3);
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.sbtns { display: inline-flex; gap: 2px; margin-left: 6px; vertical-align: middle; }
.sbtn { font-size: 12px; line-height: 1; padding: 2px 5px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; opacity: .55; }
.sbtn:hover { opacity: 1; }
.sbtn.on { opacity: 1; border-color: var(--accent); background: var(--accent-soft, rgba(127,127,127,.15)); }
.strip.s-love > .shead { box-shadow: inset 3px 0 0 #e0557a; padding-left: 6px; }
.strip.s-nope > .shead { opacity: .6; }
.tnode.s-love { outline: 2px solid #e0557a; outline-offset: 1px; }
.tnode.s-nope { opacity: .6; }
.gsheets { margin: 0 0 18px; }
.gsheets h3, .chdetail h3 { margin: 4px 0 8px; font-size: 16px; }
.gsheets h3 .sub, .chdetail .sub { font-weight: 400; color: var(--muted); font-size: 12px; margin-left: 6px; }
.chgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.chtile { display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; color: var(--ink); }
.chtile:hover { border-color: var(--accent); text-decoration: none; }
.chtile img { width: 100%; aspect-ratio: 3/4; object-fit: cover; display: block; }
.chcap { padding: 6px 8px; display: flex; flex-direction: column; gap: 2px; font-size: 13px; }
.chcap span { color: var(--muted); font-size: 11.5px; }
.chall { margin-top: 18px !important; }
.chdetail h4 { margin: 16px 0 6px; font-size: 14px; }
.shmore { margin-top: 6px; } .shmore summary { cursor: pointer; color: var(--muted); font-size: 12.5px; } .shmore .shcells { margin-top: 6px; opacity: .8; }
.chprog { font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); margin-left: 6px; }
.chprog.done { background: var(--add); border-color: var(--add); color: #fff; }
.chback { display: inline-block; margin-bottom: 6px; }
.shcells { display: flex; gap: 10px; flex-wrap: wrap; }
.shcell { margin: 0; width: 200px; display: flex; flex-direction: column; gap: 4px; }
.shcell img { width: 100%; aspect-ratio: 1; object-fit: cover; object-position: top; border-radius: 8px; cursor: zoom-in; background: #ddd; }
.shcell figcaption { font-size: 12px; color: var(--muted); }
.shcell figcaption span { opacity: .7; }
.pincount { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; white-space: nowrap; }
.pincount input { width: 46px; }
.refit { display: inline-flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.refit select { font-size: 12px; }
.refit a { font-size: 12px; }
.fitwait { font-size: 12px; color: var(--accent); }
.upfit { position: absolute; left: 5px; top: 5px; font-size: 11px; font-weight: 700; padding: 1px 5px; border-radius: 4px; background: rgba(0,0,0,.6); color: #fff; pointer-events: auto; }
select[data-fsel].on { border-color: var(--accent); color: var(--accent); }
/* lightbox action buttons, lightly colour-coded by what they do (user 2026-09-27: "color code the buttons slightly when viewing
   the enlarged images"): a faint tint + coloured border, stronger when on */
#lightbox .lbfb button, #lightbox .lbfb a.upb { --c: 128,128,128; background: linear-gradient(rgba(var(--c), .32), rgba(var(--c), .32)), #2a2833;
  border: 1px solid rgba(var(--c), .9); color: #fff; }
#lightbox .lbfb button:hover, #lightbox .lbfb a.upb:hover { background: linear-gradient(rgba(var(--c), .5), rgba(var(--c), .5)), #2a2833; }
#lightbox .lbfb button.on, #lightbox .lbfb a.upb.on { background: rgb(var(--c)); border-color: rgb(var(--c)); color: #fff; }
#lightbox .lbfb .pinb { --c: 214,166,52; }                       /* evolve / cross: gold */
#lightbox .lbfb .rerollb { --c: 70,130,220; }                    /* re-render: blue */
#lightbox .lbfb .upb, #lightbox .lbfb [data-refit] { --c: 32,170,170; }    /* upscale / refit: teal */
#lightbox .lbfb [data-fb="love"] { --c: 226,80,122; }            /* love: pink */
#lightbox .lbfb [data-fb="nope"] { --c: 150,150,150; }           /* nope: grey */
#lightbox .lbfb [data-fb="animate"] { --c: 150,90,220; }         /* animate: violet */
#lightbox .lbfb [data-fb="cast"] { --c: 70,170,90; }             /* more characters: green */
#lightbox .lbfb .exploreb { --c: 230,130,40; }                   /* journey: orange */
#lightbox .lbfb .blurb { --c: 110,120,140; }                     /* blur: slate */
#lightbox .lbfb [data-jref] { --c: 150,110,70; }                 /* journey reference: brown */
header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 16px; padding: 12px 24px; flex-wrap: wrap; }
header h1 { font-size: 18px; margin: 0; letter-spacing: .02em; }
header h1 span { color: var(--accent); }
header .stats { color: var(--muted); font-size: 13px; }
header .spacer { flex: 1; }
button, .chip { font: inherit; font-size: 13px; border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  border-radius: 999px; padding: 4px 12px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
main { padding: 20px 24px 120px; }
.round-head { display: flex; align-items: baseline; gap: 12px; margin: 28px 0 12px; flex-wrap: wrap; }
.round-head h2 { margin: 0; font-size: 20px; }
.round-head .sub { color: var(--muted); font-size: 13px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; box-shadow: var(--shadow);
  display: flex; flex-direction: column; cursor: pointer; transition: transform .12s; }
.card:hover { transform: translateY(-2px); border-color: var(--accent); }
.card .thumbs { display: grid; grid-auto-flow: column; gap: 2px; background: var(--line); }
.card .thumbs img { width: 100%; aspect-ratio: 3/4; object-fit: cover; display: block; }
.card .body { padding: 10px 12px 12px; }
.card .id { font: 12px ui-monospace, Consolas, monospace; color: var(--muted); }
.card h3 { margin: 2px 0 4px; font-size: 15px; }
.card .meta { font-size: 12px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; }
.verdict { font-size: 13px; margin-top: 6px; padding: 6px 8px; border-left: 3px solid var(--accent); background: var(--accent-soft); border-radius: 4px; }
.verdict:empty { display: none; }
.grid-wrap { overflow-x: auto; }
table.sgrid { border-collapse: separate; border-spacing: 6px; width: 100%; table-layout: fixed; }
table.sgrid th { font-size: 12px; font-weight: 600; text-align: left; vertical-align: bottom; padding: 0 2px; overflow-wrap: anywhere; }
table.sgrid th a { color: var(--ink); }
table.sgrid td img { width: 100%; aspect-ratio: 3/4; object-fit: cover; border-radius: 6px; display: block; cursor: zoom-in; }
table.sgrid td.rowlabel { font: 12px ui-monospace, Consolas, monospace; color: var(--muted); writing-mode: vertical-rl; transform: rotate(180deg); }
.crumbs { font-size: 13px; color: var(--muted); margin-bottom: 4px; }
.lin-head h2 { margin: 0 0 4px; font-size: 24px; }
.lin-head .goal { color: var(--muted); max-width: 800px; }
.rel { font-size: 13px; margin-top: 8px; display: flex; gap: 12px; flex-wrap: wrap; }
.version { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow);
  margin: 20px 0; display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); overflow: hidden; }
@media (max-width: 900px) { .version { grid-template-columns: 1fr; } }
.version .imgs { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(var(--tile), 100%), 1fr)); gap: 4px; padding: 4px; background: var(--line); }
.imgbox { position: relative; }
.imgbox img { width: 100%; display: block; border-radius: 6px; cursor: zoom-in; }
.imgbox .cap { position: absolute; left: 6px; top: 6px; font: 11px ui-monospace, Consolas, monospace; background: rgba(0,0,0,.6); color: #fff; padding: 1px 6px; border-radius: 4px; }
.imgbox .pin { position: absolute; right: 6px; top: 6px; padding: 2px 8px; font-size: 12px; background: rgba(0,0,0,.55); color: #fff; border-color: transparent; }
.imgbox .pin.on { background: var(--accent); }
.version .info { padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.vtitle { display: flex; align-items: baseline; gap: 10px; }
.vtitle b { font: 700 18px ui-monospace, Consolas, monospace; color: var(--accent); }
.label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.prompt { font-size: 13.5px; line-height: 1.6; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; white-space: pre-wrap; }
.prompt ins { text-decoration: none; background: var(--add-bg); color: var(--add); border-radius: 3px; padding: 0 1px; }
.prompt del { background: var(--del-bg); color: var(--del); border-radius: 3px; padding: 0 1px; }
.params { display: flex; flex-wrap: wrap; gap: 6px; }
.params span { font: 12px ui-monospace, Consolas, monospace; border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; }
.params span.changed { border-color: var(--add); color: var(--add); background: var(--add-bg); }
.difftoggle { align-self: flex-start; }
.chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
#tray { position: fixed; left: 0; right: 0; bottom: 0; background: var(--panel); border-top: 1px solid var(--line); padding: 8px 24px;
  display: none; align-items: center; gap: 10px; z-index: 6; box-shadow: 0 -4px 16px rgba(0,0,0,.12); }
#tray.show { display: flex; }
#tray .pins { display: flex; gap: 6px; overflow-x: auto; flex: 1; }
#tray .pins img { height: 56px; border-radius: 4px; cursor: pointer; }
#tray .pins img:hover { opacity: .5; }
#tray #pindir { flex: 1.2; min-width: 180px; max-width: 520px; font: inherit; font-size: 13px; resize: vertical; background: var(--bg); color: var(--fg);
  border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
#tray #pinsubmit { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
@media (max-width: 700px) { #tray { flex-wrap: wrap; padding: 8px 16px; } #tray #pindir { flex-basis: 100%; max-width: none; } }
.fbbar button.rerollb.on, .lbfb button.rerollb.on { background: var(--accent); color: #fff; animation: rrpulse 1s ease-in-out infinite alternate; }
@keyframes rrpulse { to { opacity: .55; } }
.fbbar button.pinb.on { background: var(--accent); color: #fff; }
.overlay { position: fixed; inset: 0; background: rgba(8,8,12,.92); z-index: 10; display: none; }
.overlay.show { display: flex; }
#lightbox { align-items: center; justify-content: center; flex-direction: column; gap: 10px; }
#lightbox img { max-width: 94vw; max-height: 62vh; border-radius: 6px; }
#lightbox .lbcap { color: #ddd; font-size: 13px; text-align: center; }
#lightbox .nav { position: absolute; top: 50%; transform: translateY(-50%); font-size: 28px; background: none; border: none; color: #fff; padding: 20px; }
#lightbox .prev { left: 8px; } #lightbox .next { right: 8px; }
.overlay .close { position: absolute; top: 12px; right: 16px; background: none; border: none; color: #fff; font-size: 26px; }
#compare { flex-direction: column; padding: 48px 16px 16px; }
#compare .cmp { flex: 1; display: grid; gap: 8px; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); min-height: 0; }
#compare figure { margin: 0; display: flex; flex-direction: column; min-height: 0; }
#compare figure img { flex: 1; min-height: 0; width: 100%; object-fit: contain; }
#compare figcaption { color: #ddd; font-size: 12px; text-align: center; padding-top: 4px; }
.cell { position: relative; }
/* hover bar: confined to its own image (user 2026-09-25: buttons bled over neighbouring images). It may never be wider
   than the tile: it wraps upward inside it, and on narrow tiles only ❤ 👎 + ⋯ (opens the full labelled bar) are shown */
.cell, .imgbox { container-type: inline-size; }
.fbbar { position: absolute; left: 6px; right: 6px; bottom: 6px; display: flex; flex-wrap: wrap-reverse; justify-content: flex-end;
  align-content: flex-start; gap: 4px; opacity: 0; transition: opacity .12s; z-index: 2; pointer-events: none; }
.fbbar > *, .fbbar .sec > * { pointer-events: auto; }
.fbbar .sec { display: contents; }
.fbbar .moreb { display: none; }
@container (max-width: 250px) {
  .fbbar .sec { display: none; }
  .fbbar .moreb { display: inline-block; }
  .fbbar.marked .sec { display: contents; }
  .fbbar.marked .sec button:not(.on) { display: none !important; }
}
.cell:hover .fbbar, .imgbox:hover .fbbar, .fbbar.marked { opacity: 1; }
.fbbar button { padding: 2px 7px; font-size: 13px; background: rgba(0,0,0,.6); color: #fff; border-color: transparent; }
.fbbar button.on { background: var(--accent); }
.fbbar.marked button:not(.on) { display: none; }
.cell:hover .fbbar.marked button, .imgbox:hover .fbbar.marked button { display: inline-block; }
.fbstat { position: absolute; left: 6px; bottom: 6px; font-size: 11px; background: rgba(0,0,0,.65); color: #fff; padding: 1px 6px; border-radius: 4px;
  white-space: nowrap; z-index: 1; cursor: help; }
.cell:hover .fbstat, .imgbox:hover .fbstat { opacity: .35; }
#sendfb { display: none; } #sendfb.show { display: inline-block; background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
#fbwait { font-size: 12px; color: var(--muted); }
.lbfb { display: flex; flex-direction: column; gap: 6px; align-items: center; width: min(640px, 94vw); }
.lbfb .row { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.lbfb button { background: #2a2833; color: #fff; border-color: #444; }
.lbfb button.on { background: var(--accent); border-color: var(--accent); }
.lbfb textarea { width: 100%; min-height: 44px; border-radius: 8px; border: 1px solid #444; background: #1b1a22; color: #eee; font: 13px system-ui, sans-serif; padding: 6px 8px; resize: vertical; }
.lbfb .reply { color: #9fe0b8; font-size: 13px; }
.lbfb .hint { color: #999; font-size: 12px; }
.lbthread { width: 100%; max-height: 26vh; overflow-y: auto; }
.lbthread .msg { background: #1b1a22; border-color: #3a3846; color: #eee; }
.lbthread .msg.claude { background: #16301f; border-color: #3f8f5f; }
.lbthread textarea { background: #1b1a22; color: #eee; border-color: #444; }
.lbthread .who, .lbthread .awaiting { color: #aaa; }
.vbadge { position: absolute; left: 6px; top: 6px; font: 11px ui-monospace, Consolas, monospace; background: rgba(0,0,0,.65); color: #fff; padding: 1px 6px; border-radius: 4px; }
.pending { display: grid; place-items: center; text-align: center; aspect-ratio: 3/4; min-width: 0; border: 1px dashed var(--muted);
  border-radius: 6px; color: var(--muted); font-size: 12px; background: var(--panel); }
table.sgrid td .cell { position: relative; }
.empty { color: var(--muted); padding: 40px 0; }
:root { --tile: 200px; --hdr: 52px; }
.toolbar { position: sticky; top: var(--hdr); z-index: 4; background: var(--bg); display: flex; gap: 6px; align-items: center;
  flex-wrap: wrap; padding: 8px 0; margin: -8px 0 4px; border-bottom: 1px solid var(--line); }
.sizer { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); font-size: 12px; margin-right: 6px; }
.sizer input { width: 130px; accent-color: var(--accent); }
.groups { display: flex; flex-wrap: wrap; gap: 6px 28px; align-items: flex-start; }
.group { max-width: 100%; min-width: 0; }
.group .round-head { width: 0; min-width: 100%; margin: 14px 0 8px; flex-wrap: nowrap; }
.group .round-head h2 { white-space: nowrap; }
.group .round-head .sub { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.group.evset { margin: 10px 0; }
.group .evhead { width: 0; min-width: 100%; }
.lead { display: flex; gap: 10px; align-items: stretch; max-width: 100%; }
.lead > .strip { min-width: 0; }
.layer-head { margin-bottom: 14px; }
.imgflow { gap: 6px; }
.vidchip { position: absolute; right: 6px; top: 32px; font-size: 12px; font-weight: 600; background: #ff9f43; color: #1d1b22 !important;
  padding: 1px 8px; border-radius: 999px; box-shadow: 0 1px 4px rgba(0,0,0,.4); }
.vidchip:hover { text-decoration: none; filter: brightness(1.1); }
.vtile video { width: 100%; aspect-ratio: 3/4; object-fit: cover; border-radius: 6px; display: block; cursor: zoom-in; background: #000; }
.vstrip .tiles, .vstrip .vtile { width: var(--tile); }
.vstrip { width: calc(var(--tile) + 12px); }
#lightbox .lbvid { max-width: 94vw; max-height: 62vh; border-radius: 6px; background: #000; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.seg button { border: 0 !important; border-radius: 0 !important; padding: 4px 10px; }
.seg button + button { border-left: 1px solid var(--line) !important; }
.toolbar select { font: inherit; font-size: 13px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 999px; padding: 4px 10px; max-width: 180px; }
.castbox { position: relative; }
.castbox input { font: inherit; font-size: 13px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 999px; padding: 4px 12px; width: 210px; }
.castbox input:focus { outline: none; border-color: var(--accent); width: 280px; }
.castlist { display: none; position: absolute; z-index: 30; top: calc(100% + 4px); left: 0; width: 380px; max-width: calc(100vw - 32px); max-height: 60vh; overflow-y: auto;
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 4px; font-size: 13px; }
.castlist.show { display: block; }
.copt { padding: 6px 9px; border-radius: 7px; cursor: pointer; }
.copt.sel { background: var(--accent-soft); }
.copt.cur b::after { content: " ✓"; color: var(--accent); }
.copt .cn { color: var(--muted); font-size: 11px; }
.copt .ch { color: var(--muted); font-size: 12px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.copt mark { background: none; color: var(--accent); font-weight: 600; }
.copt.none { color: var(--muted); cursor: default; }
.fdrop { position: relative; }
.fdrop summary { list-style: none; cursor: pointer; font-size: 13px; border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 4px 12px; user-select: none; }
.fdrop summary::-webkit-details-marker { display: none; }
.fdrop summary b { background: var(--accent); color: #fff; border-radius: 999px; padding: 0 6px; font-size: 11px; }
.fdrop .fmenu { position: absolute; z-index: 20; top: calc(100% + 4px); left: 0; background: var(--panel); border: 1px solid var(--line);
  border-radius: 10px; padding: 8px 10px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 6px; white-space: nowrap; font-size: 13px; }
.pill { background: var(--accent-soft) !important; border-color: var(--accent) !important; color: var(--accent) !important; padding: 2px 10px !important; }
.clearf { border-color: var(--accent) !important; color: var(--accent) !important; }
.reveal { background: none; border: 0; padding: 0 2px; cursor: pointer; font-size: 13px; opacity: .7; } .reveal:hover { opacity: 1; }
.lbfb .reveal { font-size: 13px; opacity: 1; }
.sdate { font: 10.5px ui-monospace, Consolas, monospace; color: var(--accent); white-space: nowrap; margin-right: 2px; }
select[data-sort] { font: inherit; font-size: 13px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 999px; padding: 4px 10px; }
.rmark { align-self: stretch; display: flex; align-items: center; justify-content: center; padding: 8px 5px; border-radius: 10px;

.jnext { margin: 28px 0 10px; background: var(--panel); border: 1px solid #3d8bfd; border-radius: 12px; padding: 14px 16px; box-shadow: var(--shadow); max-width: 980px; }
.jnext h3 { margin: 0 0 6px; font-size: 16px; }
.jnext .choices { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0 10px; }
.jnext .choices button { text-align: left; border-radius: 10px; }
.jnext textarea, .jstart textarea { width: 100%; min-height: 64px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink);
  font: 13.5px system-ui, sans-serif; padding: 8px 10px; resize: vertical; }
.jnext .row, .jstart .row { display: flex; gap: 8px; align-items: center; margin-top: 6px; flex-wrap: wrap; }
.jgo { background: #3d8bfd !important; border-color: #3d8bfd !important; color: #fff !important; font-weight: 600; }
.jstatus { font-size: 13px; color: var(--muted); }
.jstatus.done { color: var(--add); }
.jstart { width: 100%; background: #1b1a22; border: 1px solid #3d8bfd; border-radius: 10px; padding: 10px 12px; color: #eee; }
.jstart textarea { background: #14131a; color: #eee; border-color: #444; }
.jstart .hint { color: #aaa; font-size: 12px; }
/* 💬 speech bubbles over journey scenes; font scales with the image (--bfs set from the image width) */
.bubbles { position: absolute; inset: 0; pointer-events: none; overflow: hidden; font-size: var(--bfs, 13px); }
body.nobubbles .bubbles { display: none; }
.bubble { position: absolute; max-width: 40%; background: #fffdf6; color: #16141c; border: .14em solid #16141c; border-radius: 1.1em;
  padding: .45em .8em .5em; font: 700 1em/1.25 "Trebuchet MS", "Segoe UI", sans-serif; letter-spacing: .01em; text-transform: uppercase;
  box-shadow: .15em .2em 0 rgba(0,0,0,.35); }
.bubble .bwho { display: block; font-size: .72em; letter-spacing: .08em; color: #a1244f; margin-bottom: .1em; }
.bubble::after, .bubble::before { content: ""; position: absolute; border-style: solid; }
.bubble.t-bl::before { left: 1.2em; bottom: -1.05em; border-width: 1.05em .9em 0 0; border-color: #16141c transparent transparent; }
.bubble.t-bl::after { left: 1.38em; bottom: -.72em; border-width: .78em .62em 0 0; border-color: #fffdf6 transparent transparent; }
.bubble.t-br::before { right: 1.2em; bottom: -1.05em; border-width: 1.05em 0 0 .9em; border-color: #16141c transparent transparent; }
.bubble.t-br::after { right: 1.38em; bottom: -.72em; border-width: .78em 0 0 .62em; border-color: #fffdf6 transparent transparent; }
.bubble.t-b::before { left: calc(50% - .6em); bottom: -1.05em; border-width: 1.05em .6em 0; border-color: #16141c transparent transparent; }
.bubble.t-b::after { left: calc(50% - .4em); bottom: -.72em; border-width: .78em .4em 0; border-color: #fffdf6 transparent transparent; }
.bubble.t-tl::before { left: 1.2em; top: -1.05em; border-width: 0 .9em 1.05em 0; border-color: transparent transparent #16141c; }
.bubble.t-tl::after { left: 1.38em; top: -.72em; border-width: 0 .62em .78em 0; border-color: transparent transparent #fffdf6; }
.bubble.t-tr::before { right: 1.2em; top: -1.05em; border-width: 0 0 1.05em .9em; border-color: transparent transparent #16141c; }
.bubble.t-tr::after { right: 1.38em; top: -.72em; border-width: 0 0 .78em .62em; border-color: transparent transparent #fffdf6; }
.bubble.radio { border-style: dashed; border-radius: .3em; background: #eef6ff; }
.bubble.radio .bwho { color: #1f5fbf; }
.lbstage { position: relative; display: inline-block; line-height: 0; }
.lbstage .bubbles { line-height: normal; }
.bubtoggle.on { background: #3d8bfd; border-color: #3d8bfd; color: #fff; }
/* phone layout (user 2026-09-28: "make the menus expandable and collapsible on phone"): header and filter toolbars
   collapse behind ☰ Menu / ⚙ Filters; active filter pills and the Send button stay visible */
.mobonly { display: none; }
.tapheart { position: fixed; z-index: 30; transform: translate(-50%, -50%) scale(.4); font-size: 90px; pointer-events: none;
  animation: tapheart .8s ease-out forwards; text-shadow: 0 2px 12px rgba(0,0,0,.5); }
@keyframes tapheart { 30% { transform: translate(-50%, -50%) scale(1.15); opacity: 1; } 100% { transform: translate(-50%, -80%) scale(1); opacity: 0; } }
@media (max-width: 700px) {
  .mobonly { display: inline-block; }
  header { padding: 8px 12px; gap: 8px; }
  header h1 { font-size: 15px; }
  header:not(.open) > :not(h1):not(#menubtn):not(#sendfb) { display: none !important; }
  header.open #menubtn { background: var(--accent); border-color: var(--accent); color: #fff; }
  .toolbar { flex-wrap: wrap; }
  body:not(.tbopen) .toolbar > :not(.tbtoggle):not(.pill):not(.clearf) { display: none !important; }
  body.tbopen .tbtoggle { background: var(--accent); border-color: var(--accent); color: #fff; }
  #lightbox .lbstage { touch-action: pan-y; }
  /* phone picture mode (user 2026-09-28: "minimize the menu at the base and fit the image to resolution"): details hidden,
     the picture fills the screen; ⌃ Details brings the caption and buttons back */
  #lightbox.lbmin { justify-content: center; padding: 0; }
  #lightbox.lbmin .lbcap, #lightbox.lbmin .lbfb { display: none; }
  #lightbox.lbmin img, #lightbox.lbmin video { max-width: 100vw; max-height: calc(100vh - 56px); border-radius: 0; }
  /* details open: the whole overlay scrolls, with room for the phone's bottom bar + keyboard, so the comment box is reachable
     (user 2026-09-28: "comments are hard to use on phone ... due to phone bottom menus") */
  #lightbox:not(.lbmin) { overflow-y: auto; justify-content: flex-start; padding: 60px 8px calc(160px + env(safe-area-inset-bottom)); }
  #lightbox:not(.lbmin) img, #lightbox:not(.lbmin) video { max-height: 55dvh; }
  #lightbox:not(.lbmin) .lbmintog { bottom: auto; top: 10px; left: 10px; transform: none; }
  body:has(#lightbox.show) #tray, body:has(#lightbox.show) #totop { display: none !important; }
  #lightbox .lbmintog { position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%); z-index: 20; border-radius: 999px;
    padding: 8px 16px; background: rgba(0,0,0,.65); color: #fff; border: 1px solid rgba(255,255,255,.4); }
  #lightbox .nav { opacity: .45; font-size: 22px; padding: 6px 8px; }
  #lightbox .close { position: fixed; top: 10px; right: 10px; z-index: 20; width: 44px; height: 44px; border-radius: 50%;
    background: rgba(0,0,0,.65); border: 1px solid rgba(255,255,255,.4); font-size: 22px; line-height: 1; display: flex; align-items: center; justify-content: center; }
}
</style>
</head>
<body>
<header>
  <h1>Qwen Image 2.1 · <span>Anime Lab</span></h1>
  <button id="menubtn" class="mobonly" title="Show / hide the menu">☰ Menu</button>
  <span class="stats" id="stats"></span>
  <span class="spacer"></span>
  <nav id="layers"></nav>
  <span class="search"><input id="q" type="search" placeholder="Search styles…  ( / )" autocomplete="off"
    title="Searches the full prompts (style + every character's description), titles, tags and my notes. Several words = all must match; use &quot;quotes&quot; for an exact phrase."><span id="qcount"></span></span>
  <button id="cmbtn" title="Comments for your agent" hidden>💬 Comments</button>
  <button id="qbtn" title="Generation queue: what's rendering and what's next">⚙ Queue</button>
  <span id="fbwait"></span>
  <button id="sendfb" title="Send your marks and notes to your coding agent">▶ Send marks</button>
  <span id="live" class="chip" title="">● Live</span>
  <button id="blurall" title="">🌫 Blur</button>
  <button id="theme" title="Toggle theme">◐</button>
</header>
<main id="app"></main>
<button id="totop" title="Back to top">↑</button>

<div id="tray"><span class="label" id="pinlabel">Pinned</span><div class="pins"></div>
  <label class="pincount" title="How many variant styles (galleries) to make from this evolve/cross">Variations <input id="pincount" type="number" min="1" max="9" value="3"></label>
  <textarea id="pindir" rows="2" placeholder="Directions for your agent: what to keep, change or try (optional). Type @ to reference any image"></textarea>
  <button id="pinsubmit" title="Done adding images and directions: send this set to your agent">Submit</button>
  <button id="cmpbtn">Compare</button><button id="clearpins">Clear</button></div>
<div id="lightbox" class="overlay"><button class="close">×</button><button class="nav prev">‹</button><div class="lbstage"><img alt=""><div class="bubbles"></div></div><video class="lbvid" controls loop playsinline style="display:none"></video><div class="lbcap"></div><div class="lbfb"></div><button class="nav next">›</button><button class="lbmintog mobonly" title="Show / hide the caption and buttons">⌃ Details</button></div>
<aside id="drawer"></aside>
<aside id="qpanel"></aside>
<div id="atpop" role="listbox"></div>
<div id="compare" class="overlay"><button class="close">×</button><div class="cmp"></div></div>

<script>
const RAW = /*__DATA__*/{};
let DATA = [], SUBJ = {}, SUBJT = {}, byId = {}, VIDS = [], JRN = [], jById = {}, MTIMES = {}, UPS = {}, FITS = {};
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store = { get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
                set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };

// theme
const applyTheme = t => t ? document.documentElement.setAttribute("data-theme", t) : document.documentElement.removeAttribute("data-theme");
applyTheme(store.get("theme", null));
$("#theme").onclick = () => {
  const dark = getComputedStyle(document.body).backgroundColor === "rgb(20, 19, 26)";
  const t = dark ? "light" : "dark"; store.set("theme", t); applyTheme(t);
};

function setData(raw) {
  (raw.lineages || []).forEach(l => delete l._text);
  // "hub only" lineages (a research/reference tag): kept out of the survey/images/evolution/tree pages, still reachable by id
  const allL = raw.lineages || [];
  DATA = allL.filter(l => !(l.tags || []).some(t => /hub only/i.test(t))); SUBJ = raw.subjects || {}; SUBJT = raw.subject_text || {}; VIDS = raw.videos || []; byId = Object.fromEntries(allL.map(l => [l.id, l]));
  JRN = raw.journeys || []; jById = Object.fromEntries(JRN.map(j => [j.id, j]));
  MTIMES = raw.mtimes || {}; UPS = raw.upscaled || {}; FITS = raw.resized || {};
  const nImg = DATA.reduce((a, l) => a + l.versions.reduce((b, v) => b + v.images.length, 0), 0);
  $("#stats").textContent = `${DATA.length} lineages · ${DATA.reduce((a, l) => a + l.versions.length, 0)} versions · ${nImg} images`;
}
setData(RAW);

// feedback marks (served by tools/serve_gallery.py)
const ACTIONS = [["animate", "🎬", "Animate: turn this image into a video clip (add a note for the motion)"],   ["cast", "👥", "More characters: new characters in this same style (stays on this layer, not an evolution)"],
  ["love", "❤", "Love: keep this quality"], ["nope", "👎", "Nope: dead end"]];
let FB = {};
const hasAct = (m, a) => !!m && ((m.actions || (m.action ? [m.action] : [])).includes(a));
// project-relative key of an image/clip: "evolutions/..." (lab) or "journeys/..." (🧭 journey scenes)
// memoized: the 🎮 Props page called this ~1M times per redraw (900 ms; user 2026-09-26: "reviewing props is still super laggy")
const FBK = new Map();
const fbKey = src => {
  let k = FBK.get(src);
  if (k === undefined) { const m = String(src).match(/(?:evolutions|journeys)\/[^?]*/); k = m ? m[0] : src; if (FBK.size > 50000) FBK.clear(); FBK.set(src, k); }
  return k;
};
const isScene = src => fbKey(src).startsWith("journeys/");
const canFB = location.protocol.startsWith("http");
async function fbPost(path, body) {
  try {
    const r = await fetch(path, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body || {})});
    const j = await r.json(); FB = j.state || j; paintFB();
  } catch { $("#fbwait").textContent = "⚠ can't reach gallery server; mark not saved"; }
}
function fbBar(src, cap) {
  if (!canFB) return "";
  const m = FB[fbKey(src)];
  const n = cmCount(imgTarget(src));
  // compact badge; the full reply is in the tooltip and the enlarged view, so it never covers the buttons
  const stat = [n ? `💬${n}` : "", !m ? "" : m.status === "done" ? "✓" : m.status === "sent" ? "⏳" : ""].filter(Boolean).join(" ");
  const statTip = [n ? `${n} comment${n > 1 ? "s" : ""}` : "", m && m.status === "done" ? "Agent: " + (m.reply || "") : m && m.status === "sent" ? "Sent to your agent" : ""].filter(Boolean).join(" · ");
  const acts = isScene(src) ? ACTIONS.filter(([a]) => a !== "cast") : ACTIONS;
  const fbB = ([a, ic, tip]) => `<button data-fb="${a}" data-src="${esc(src)}" data-cap="${esc(cap)}" title="${tip}" class="${hasAct(m, a) ? "on" : ""}">${ic}</button>`;
  const primary = acts.filter(([a]) => a === "love" || a === "nope"), secondary = acts.filter(([a]) => a !== "love" && a !== "nope");
  // secondary actions hide on narrow tiles (container query); ⋯ opens the enlarged view with every action labelled
  // 📌 stays on the tile at every size (user 2026-09-25: pinning is multi-select, opening each image is annoying);
  // a pinned tile keeps its bar visible so you can see what's in the tray
  const pinned = !isScene(src) && isPinned(src);
  return `<div class="fbbar ${m || isBlurred(src) || pinned ? "marked" : ""}"><span class="sec">${rerollBtn(src)}${upscaleBtn(src)}${exploreBtn(src, cap)}${secondary.map(fbB).join("")}${blurBtn(src)}</span>${isScene(src) ? "" : pinBtn(src, cap)}${primary.map(fbB).join("")}<button class="moreb" data-more title="More actions (reroll, animate, explore, blur…)">⋯</button></div>
    ${stat ? `<span class="fbstat" title="${esc(statTip)}">${stat}</span>` : ""}`;
}
function paintFB() {
  const marks = Object.values(FB), pending = marks.filter(m => m.status === "pending").length, sent = marks.filter(m => m.status === "sent").length;
  $("#sendfb").classList.toggle("show", pending > 0);
  $("#sendfb").textContent = `▶ Send ${pending} mark${pending === 1 ? "" : "s"}`;
  $("#fbwait").textContent = sent ? `${sent} with your agent…` : "";
  if ($("#lightbox").classList.contains("show")) showLB();
  const y = window.scrollY; render(true); window.scrollTo(0, y);
}
async function fbLoad() {
  try {
    const j = await (await fetch("/api/feedback", {cache: "no-store"})).json();
    if (JSON.stringify(j) !== JSON.stringify(FB)) { FB = j; paintFB(); }
  } catch {}
}
document.addEventListener("click", e => {
  const mb = e.target.closest("[data-more]"); if (!mb) return;
  e.stopPropagation(); e.preventDefault();
  const host = mb.closest(".cell, .imgbox"); const img = host && host.querySelector("img[data-src], img[data-jscene], video[data-vsrc]");
  if (img) img.click();
}, true);
document.addEventListener("click", e => {
  const b = e.target.closest("[data-fb]"); if (!b) return;
  e.stopPropagation(); e.preventDefault();
  fbPost("/api/feedback", {src: b.dataset.src, cap: b.dataset.cap, action: b.dataset.fb});  // server toggles; marks stack
}, true);
$("#sendfb").onclick = () => fbPost("/api/feedback/submit");
// 📂 opens the clip's folder in Windows Explorer (server-side; videos only)
const revealBtn = (src, label = "") => canFB ? `<button class="reveal" data-reveal="${esc(src)}" title="Open the containing folder in Explorer">📂${label}</button>` : "";
document.addEventListener("click", e => {
  const b = e.target.closest("[data-reveal]"); if (!b) return;
  e.stopPropagation(); e.preventDefault();
  fetch("/api/reveal", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({src: b.dataset.reveal})}).catch(() => {});
}, true);

// comments (threads per target: general | round:N | lineage:ID | version:ID/vNN)
let CM = [];
const imgTarget = src => "image:" + fbKey(src);
const cmCount = tg => CM.filter(c => c.target === tg).length;
const cmLabel = tg => tg.startsWith("image:journeys/") ? "Journey scene " + tg.slice(15).replace(/\.png$/, "")
  : tg.startsWith("image:") ? "Image " + tg.slice(6).replace(/^evolutions\//, "").replace(/\.png$/, "")
  : tg === "general" ? "General" : tg.startsWith("round:") ? `Round ${tg.slice(6)}`
  : tg.startsWith("journey:") ? `Journey ${tg.slice(8)}` : tg.startsWith("lineage:") ? `Lineage ${tg.slice(8)}` : tg.startsWith("version:") ? `Version ${tg.slice(8)}` : tg;
const cmLink = tg => tg.startsWith("image:journeys/") ? `#/j/${tg.slice(6).split("/")[1]}` : tg.startsWith("image:") ? `#/l/${tg.slice(6).split("/")[1]}`
  : tg.startsWith("journey:") ? `#/j/${tg.slice(8)}` : tg.startsWith("lineage:") ? `#/l/${tg.slice(8)}` : tg.startsWith("version:") ? `#/l/${tg.slice(8).split("/")[0]}` : null;
function awaitingTargets() {
  const last = {}; CM.forEach(c => last[c.target] = c);
  return Object.keys(last).filter(k => last[k].author === "you");
}
function thread(target, placeholder) {
  if (!canFB) return "";
  const msgs = CM.filter(c => c.target === target);
  const waiting = msgs.length && msgs[msgs.length - 1].author === "you";
  return `<div class="thread">${msgs.map(m => `<div class="msg ${m.author}"><span class="who">${m.author === "claude" ? "Agent" : "You"} · ${esc(m.ts)}</span>${esc(m.text)}</div>`).join("")}
    ${waiting ? `<span class="awaiting">Sent. Your agent will reply here.</span>` : ""}
    <div class="compose"><textarea data-draft="${esc(target)}" placeholder="${esc(placeholder || "Comment for your agent… (Ctrl+Enter to send)")}"></textarea>
      <button data-cpost="${esc(target)}">Send</button></div></div>`;
}
function drawer() {
  const rounds = [...new Set(DATA.filter(l => !l.depth).map(l => l.round))].sort((a, b) => b - a);
  const fixed = ["general", ...rounds.map(r => `round:${r}`)];
  const others = [...new Set(CM.map(c => c.target))].filter(t => !fixed.includes(t))
    .sort((a, b) => a.startsWith("image:") - b.startsWith("image:"));
  return `<button class="dclose" data-dclose>×</button>
    <h3>General</h3>${thread("general", "Anything about the project, direction, or the gallery…")}
    ${rounds.map(r => `<h3>Round ${r}</h3>${thread(`round:${r}`, `About round ${r} as a whole…`)}`).join("")}
    ${others.length ? `<h3 style="margin-top:24px">Lineage, version & image threads</h3>` + others.map(tg =>
      `<h3>${cmLink(tg) ? `<a href="${cmLink(tg)}">${esc(cmLabel(tg))}</a>` : esc(cmLabel(tg))}</h3>${thread(tg)}`).join("") : ""}`;
}
// re-render a container without losing what the user is typing
function keepDrafts(el, fn) {
  const drafts = {}, act = document.activeElement;
  // textareas AND single-line inputs (direction notes, "none of these" reasons: user 2026-09-26 "typing a comment ... gets cleared")
  const SEL = "textarea[data-draft], input[data-draft], select[data-draft]";
  el.querySelectorAll(SEL).forEach(t => drafts[t.dataset.draft] = t.value);
  const focus = act && act.dataset && act.dataset.draft && el.contains(act) ? [act.dataset.draft, act.selectionStart, act.selectionEnd] : null;
  fn();
  el.querySelectorAll(SEL).forEach(t => { if (drafts[t.dataset.draft]) t.value = drafts[t.dataset.draft]; });
  if (focus) { const t = el.querySelector(`[data-draft="${CSS.escape(focus[0])}"]`); if (t) { t.focus(); try { t.setSelectionRange(focus[1], focus[2]); } catch {} } }
}
function paintCM() {
  const n = awaitingTargets().length;
  $("#cmbtn").innerHTML = `💬 Comments${CM.length ? `<span class="dot" title="${n} thread(s) awaiting your agent">${CM.length}</span>` : ""}`;
  if ($("#drawer").classList.contains("show")) keepDrafts($("#drawer"), () => $("#drawer").innerHTML = drawer());
  if ($("#lightbox").classList.contains("show")) showLB();
  const y = window.scrollY; render(true); window.scrollTo(0, y);
}
async function cmLoad() {
  try {
    const j = await (await fetch("/api/comments", {cache: "no-store"})).json();
    if (JSON.stringify(j) !== JSON.stringify(CM)) { CM = j; paintCM(); }
  } catch {}
}
async function cmPost(target) {
  const ta = document.querySelector(`textarea[data-draft="${CSS.escape(target)}"]`);
  let text = ta && ta.value.trim(); if (!text) return;
  // a comment on the open video carries its playback time, so "tone here" can be located in the clip
  const lv = $("#lightbox .lbvid");
  if (target.endsWith(".mp4") && $("#lightbox").classList.contains("show") && lv.getAttribute("src") && target === imgTarget(lv.getAttribute("src")))
    text = `[@${lv.currentTime.toFixed(1)}s] ${text}`;
  try {
    const r = await fetch("/api/comments", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({target, text})});
    if (!r.ok) throw 0;
    document.querySelectorAll(`textarea[data-draft="${CSS.escape(target)}"]`).forEach(t => t.value = "");
    CM = await r.json(); paintCM();
  } catch { $("#fbwait").textContent = "⚠ can't reach gallery server; comment not sent"; }
}
document.addEventListener("click", e => {
  const p = e.target.closest("[data-cpost]"); if (p) { e.preventDefault(); cmPost(p.dataset.cpost); return; }
  if (e.target.closest("[data-dclose]")) $("#drawer").classList.remove("show");
});
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey) && e.target.dataset && e.target.dataset.draft) { e.preventDefault(); cmPost(e.target.dataset.draft); }
});
$("#cmbtn").onclick = () => {
  const d = $("#drawer"); d.classList.toggle("show");
  if (d.classList.contains("show")) keepDrafts(d, () => d.innerHTML = drawer());
};

// word diff (LCS over tokens)
function diffWords(a, b) {
  const A = a.split(/(\s+)/), B = b.split(/(\s+)/);
  const n = A.length, m = B.length, L = Array.from({length: n + 1}, () => new Uint16Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    L[i][j] = A[i] === B[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  let i = 0, j = 0, out = "";
  while (i < n && j < m) {
    if (A[i] === B[j]) { out += esc(A[i]); i++; j++; }
    else if (L[i + 1][j] >= L[i][j + 1]) out += `<del>${esc(A[i++])}</del>`;
    else out += `<ins>${esc(B[j++])}</ins>`;
  }

        <a class="treelink" href="#/tree/${esc(l.id)}" title="See where this style came from and what it spawned">🌳 Family tree</a>
        <button id="difft" class="difftoggle ${showDiff ? "on" : ""}">Show prompt diffs</button>
        <label class="sizer" title="Image size">▫<input type="range" min="100" max="520" step="10" value="${tileSize()}" data-tile>▣</label></div>
      <div class="lin-thread">${thread(`lineage:${l.id}`, `Comment on the ${l.title} lineage as a whole…`)}</div></div>
    ${versions}`;
}

function layerPage(n, from, hl) {
  const mode = store.get("ovmode", "grid"), only = store.get("renderedOnly", false);
  const all = DATA.filter(l => l.depth === n);
  const prevName = n === 1 ? "the Survey" : `Evolution ${n - 1}`;
  if (!all.length) return `<p class="empty">Evolution ${n} doesn't exist yet. It appears once an image on ${prevName} is evolved.</p>`;
  // one evolution set per parent combination; its variants are sibling styles (columns)
  const setKey = l => parentsOf(l).join(" × ");
  const sets = [...new Set(all.map(setKey))];
  if (sortKey() !== "rounds") {  // order whole sets too, by their newest style (sortStyles alone only reorders inside a set)
    const by = sortKey() === "recent" ? "rendered" : "created";
    const newest = key => Math.max(0, ...all.filter(l => setKey(l) === key).map(l => l[by] || 0));
    sets.sort((a, b) => sortKey() === "old" ? newest(a) - newest(b) : newest(b) - newest(a));
  }
  const hlSet = hl && hl.startsWith("set:") && byId[hl.slice(4)] ? setKey(byId[hl.slice(4)]) : null;
  const parentCard = img => {
    const [, pl, pv] = img.split("/");
    const plin = byId[pl], pslot = plin?.versions.find(v => v.id === pv)?.slots.find(sl => sl.src && fbKey(sl.src) === img);
    const up = imageHome(img);
    return `<div class="evparent1"><a href="${up}" title="Go to this parent image"><img src="../${esc(img)}" loading="lazy"></a>
      <a href="${up}">↑ ${esc(plin ? plin.title : pl)}<br><span class="sub">${esc(pv)}${pslot ? " · " + esc(pslot.label) : ""}${plin?.depth ? ` · Evolution ${plin.depth}` : " · Survey"}</span></a></div>`;
  };
  return `<div class="layer-head"><h2>Evolution ${n}</h2>
    <div class="sub">${sets.length} evolution set${sets.length > 1 ? "s" : ""}. Each grows from one image (or crossbreeds several) on an earlier layer.
      Every variant style makes one deliberate change and is shown on all subjects. Evolve any image here to go further out.</div></div>` +
    toolbar() + sets.map((key, i) => {
      let ls = all.filter(l => setKey(l) === key);
      if (sortKey() !== "rounds") ls = sortStyles(ls);
      const parents = parentsOf(ls[0]);
      if (only) ls = ls.filter(l => l.versions.some(v => v.images.length));
      if (store.get("heartOnly", false)) ls = ls.filter(lovedLineage);
      if (store.get("evolvedOnly", false)) ls = ls.filter(evolvedLineage);
      if (store.get("hideNope", false)) ls = ls.filter(notAllNoped);
        ls = ls.filter(matchQ);
      const isHl = (from && parents.includes(from)) || hlSet === key ||
        (hl && ls.some(l => l.versions.some(v => v.images.some(im => fbKey(im.src) === hl))));
      const setTreeHref = `#/tree/${esc(ls[0]?.id || "")}`;
      const head = `<div class="evhead">${parents.map(parentCard).join(`<span class="cross">×</span>`)}
          <div><div class="label">Evolution set ${i + 1}${parents.length > 1 ? " · crossbreed" : ""}
              <a class="treelink" href="${setTreeHref}" title="See this set's family tree">🌳 Family tree</a></div>
            <div class="sub">${ls.length} variant style${ls.length === 1 ? "" : "s"}: ${ls.map(l => `<a href="#/l/${l.id}">${esc(l.title)}</a>`).join(" · ")}</div></div></div>`;
      if (mode === "cards") return `<section class="evset ${isHl ? "hl" : ""}">${head}${ls.length ? `<div class="cards">${ls.map(card).join("")}</div>` : ""}</section>`;
      const strips = !ls.length ? [] : styleGrid(ls, "s" + i, `Evolution ${n} · set ${i + 1}`, hl && !hl.startsWith("set:") ? hl : null,
        {raw: true, stripClass: isHl ? "hl" : ""});
      if (!strips.length) return "";
      const mark = `<div class="evmark evset ${isHl ? "hl" : ""}" title="Evolution set ${i + 1}: ${esc(ls.map(l => l.title).join(" · "))}">
          <div class="label">Set ${i + 1}${parents.length > 1 ? " · cross" : ""}</div>
          ${parents.map(p => `<a href="${imageHome(p)}" title="↑ parent: ${esc(p.split("/").slice(1, 3).join("/"))}"><img src="../${esc(p)}" loading="lazy"></a>`).join(`<span class="cross">×</span>`)}
          <div class="label">↑ parent${parents.length > 1 ? "s" : ""}</div>
          <a class="treelink evmarktree" href="${setTreeHref}" title="See this set's family tree">🌳</a></div>`;
      return `<div class="lead">${mark}${strips[0]}</div>` + strips.slice(1).join("");
    }).join("").replace(/^/, mode === "cards" ? "" : '<div class="strips flow">') + (mode === "cards" ? "" : "</div>");
}

// every rendered image from every lineage and version, as a flat searchable list
function allImages() {
  return DATA.flatMap(l => l.versions.flatMap(v => v.slots.filter(sl => sl.src).map(sl => ({
    l, v, sl, text: [l.id, l.title, l.goal, ...(l.tags || []), v.id, v.prompt, v.notes.change, v.notes.verdict, v.notes.why,
      sl.label, sl.subject, SUBJ[sl.subject] || "", SUBJT[sl.subject] || "", (sl.subject || "").split("@")[1] || "",
      l.depth ? "evolution " + l.depth + " evolved" : "survey round " + l.round].join(" ").toLowerCase(),
  }))));
}
function imagesPage() {
  const q = Q(), heart = store.get("heartOnly", false), hideN = store.get("hideNope", false);
  const evo = store.get("evolvedOnly", false), all = allImages();
  let items = all.filter(it => hasAll(it.text, q) && subjMatch(it.sl.subject)
    && (!heart || isLoved(it.sl.src)) && !(hideN && isNoped(it.sl.src)) && upFitOk(it.sl.src) && (!evo || (it.l.depth || 0) > 0));
  const k = sortKey();
  items.sort(k === "rounds" ? (a, b) => a.l.id.localeCompare(b.l.id) || a.v.id.localeCompare(b.v.id)
    : k === "old" ? (a, b) => a.sl.ts - b.sl.ts : (a, b) => b.sl.ts - a.sl.ts);
  $("#qcount").textContent = q ? `${items.length} image${items.length === 1 ? "" : "s"}` : "";
  const head = `<div class="layer-head"><h2>🖼 Images</h2><div class="sub">All ${all.length} images from the survey and every evolution layer.
    Search matches style, character, cast, prompt words and my notes. 🌱 Evolved only = evolution images.</div></div>`;
  if (!items.length) return head + toolbar() + `<p class="empty">No images match.</p>`;
  return head + toolbar() + `<div class="strips flow imgflow">${items.map(({l, v, sl}) => {
    const cap = `${l.id} ${l.title} · ${v.id} · ${sl.label}`, where = l.depth ? `Evolution ${l.depth}` : `Round ${l.round}`;
    const der = derivedOf(sl.src);
    if (der) return der.map(dv => `<div class="tile cell" title="${esc(`${l.title} · ${v.id} · ${sl.label} · ${dv.tag}`)}">
      <img src="${esc(th(dv.src))}" data-grid="all" data-src="${esc(dv.src)}" data-cap="${esc(`${where} · ${cap} · ${dv.tag}`)}" loading="lazy">
      <span class="tlabel">${esc(l.id.slice(0, 3))} · ${esc(dv.tag)}</span></div>`).join("");
    return `<div class="tile cell" title="${esc(`${l.title} · ${v.id} · ${sl.label} · ${where}`)}">
      <img src="${esc(th(sl.src))}" data-grid="all" data-src="${esc(sl.src)}" data-cap="${esc(`${where} · ${cap}`)}" loading="lazy">
      <span class="tlabel">${esc(l.id.slice(0, 3))} · ${esc(subjShort(sl.subject || "f-modern"))}</span>
      ${fbBar(sl.src, cap)}${evoChip(sl.src)}${vidChip(sl.src)}${jChip(sl.src)}</div>`;
  }).join("")}</div>`;
}
const ENGINE_LABEL = {fasth3: "FastH3", h3turbo: "H3 turbo"};
function vidText(v) {
  return [v.title, v.lineage, v.subject_label, v.subject, v.engine, ENGINE_LABEL[v.engine], v.tag, v.prompt, v.note, "depth " + v.depth].join(" ").toLowerCase();
}
function videosPage(imgFilter) {
  const q = Q(), heart = store.get("heartOnly", false), hideN = store.get("hideNope", false);
  let vs = VIDS.filter(v => (!imgFilter || v.image === imgFilter) && hasAll(vidText(v), q)
    && subjMatch(v.subject) && (!heart || isLoved(v.src)) && !(hideN && isNoped(v.src)));
  vs = [...vs].sort((a, b) => sortKey() === "old" ? a.created - b.created : b.created - a.created);
  $("#qcount").textContent = q ? `${vs.length} clip${vs.length === 1 ? "" : "s"}` : "";
  const head = `<div class="layer-head"><h2>🎬 Videos</h2><div class="sub">${VIDS.length} clips animated from lab images.
      Hover to play (muted), click for full size with sound. Search matches style, character, engine and the motion prompt.
      ${imgFilter ? `Showing clips of one image · <a href="#/videos">show all</a>` : ""}</div></div>`;
  if (!vs.length) return head + toolbar() + `<p class="empty">No clips match. Mark an image with 🎬 (optionally with a note describing the motion) and send it.</p>`;
  return head + toolbar() + `<div class="strips flow">${vs.map(v => {
    const cap = `${v.title} · ${v.subject_label} · ${ENGINE_LABEL[v.engine] || v.engine}`;
    return `<div class="strip vstrip"><div class="shead"><a href="${v.depth ? `#/e/${v.depth}?hl=${encodeURIComponent(v.image)}` : `#/l/${v.lineage}`}" title="Go to the source image">${esc(v.title)}</a>
        <span class="sdate">${esc(ENGINE_LABEL[v.engine] || v.engine)}${v.tag ? " · " + esc(v.tag) : ""}${v.render_seconds ? ` · ${Math.round(v.render_seconds)}s` : ""}</span>${revealBtn(v.src)}</div>
      <div class="tile cell vtile"><video src="${esc(v.src)}" poster="${esc(v.poster)}" muted loop playsinline preload="none"
          data-vsrc="${esc(v.src)}" data-cap="${esc(cap)}" data-prompt="${esc(v.prompt)}"></video>
        <span class="tlabel">${esc(subjShort(v.subject))}</span>${fbBar(v.src, cap)}</div>
      ${v.note ? `<div class="snote" title="${esc(v.note)}">${esc(v.note)}</div>` : ""}</div>`;
  }).join("")}</div>`;
}
function bindVideos(app) {
  const list = [...app.querySelectorAll("video[data-vsrc]")].map(x => ({src: x.dataset.vsrc, cap: x.dataset.cap, prompt: x.dataset.prompt, video: true}));
  app.querySelectorAll("video[data-vsrc]").forEach(v => {
    v.onmouseenter = () => { v.play().catch(() => {}); };
    v.onmouseleave = () => { v.pause(); };
    v.onclick = () => openLB(list, list.findIndex(x => x.src === v.dataset.vsrc));
  });
}

// a redraw rebuilds the DOM and would cut off a playing audio/video clip: defer it until playback stops
const mediaPlaying = () => [...document.querySelectorAll("audio, video")].some(m => !m.paused && !m.ended && !m.muted);
let PENDING_RENDER = false, PENDING_RELOAD = false;
const typing = () => { const a = document.activeElement; return !!a && /^(TEXTAREA|INPUT)$/.test(a.tagName) && a.type !== "range" && a.type !== "checkbox" && a.id !== "q" && a.id !== "gq" && $("#app").contains(a); };
function render(keepScroll = false, force = false) {
  if (!force && (mediaPlaying() || typing())) { PENDING_RENDER = true; return; }
  keepDrafts($("#app"), () => renderInner(keepScroll));
}
["pause", "ended", "focusout"].forEach(ev => document.addEventListener(ev, () => setTimeout(() => {
  if (mediaPlaying() || typing()) return;
  if (PENDING_RELOAD) { location.reload(); return; }
  if (PENDING_RENDER) { PENDING_RENDER = false; const y = window.scrollY; render(true); window.scrollTo(0, y); }
}, 150), true));
function renderInner(keepScroll) {
  const h = location.hash.replace(/^#\/?/, "");
  const app = $("#app");
  let lbList = [];
  layerNav();
  if (/^j(\/|$)/.test(h)) {
    const id = h.slice(2).split("?")[0];
    app.innerHTML = id ? journeyPage(id) : journeysPage();
    bindGrid(app); if (id) bindJourney(app, id);
  } else if (h.startsWith("images")) {
    app.innerHTML = imagesPage();
    bindGrid(app);
  } else if (h.startsWith("videos")) {
    const q = new URLSearchParams(h.split("?")[1] || "");
    app.innerHTML = videosPage(q.get("img"));
    bindGrid(app); bindVideos(app);
  } else if (h.startsWith("e/")) {
    const [path, qs] = h.slice(2).split("?"); const q = new URLSearchParams(qs || "");
    app.innerHTML = layerPage(parseInt(path) || 1, q.get("from"), q.get("hl"));
    bindGrid(app);
    if (!keepScroll) { const target = app.querySelector(".cell.hl") || app.querySelector(".hl"); if (target) { target.scrollIntoView({block: "center"}); keepScroll = true; } }
  } else if (h.startsWith("l/")) {
    const id = h.slice(2); app.innerHTML = lineage(id);
    const l = byId[id];
    if (l) lbList = l.versions.flatMap(v => v.images.map(im => ({src: im.src, cap: `${l.id}/${v.id} · ${im.name}`})));
    app.querySelectorAll(".imgbox img").forEach(img => img.onclick = () =>
      openLB(lbList, lbList.findIndex(x => x.src === img.dataset.src)));
    bindGrid(app);
    const dt = $("#difft"); if (dt) dt.onclick = () => { store.set("diff", !store.get("diff", true)); render(); };
  } else if (h.startsWith("tree/")) {
    app.innerHTML = treePage(h.slice(5).split("?")[0]);
    bindGrid(app); bindTree(app);
  } else {
    app.innerHTML = overview();
    bindGrid(app);
  }
  if (!keepScroll) window.scrollTo(0, 0);
}
function bindGrid(app) {
  {
    app.querySelectorAll("[data-sort]").forEach(sel => sel.onchange = () => { store.set("sort", sel.value); render(); });
    app.querySelectorAll("[data-tile]").forEach(r => r.oninput = () => {
      const px = +r.value; applyTile(px); store.set("tile", px); document.body.classList.toggle("compact", px < 150); });
    app.querySelectorAll("[data-nope]").forEach(b => b.onclick = () => { store.set("hideNope", !store.get("hideNope", false)); render(true); });
    app.querySelectorAll("[data-clearf]").forEach(b => b.onclick = () => {
      ["fcast", "fg", "fgenre"].forEach(k => store.set(k, "all")); store.set("q", ""); FILTER_KEYS.forEach(k => store.set(k, fdef(k)));
      $("#q").value = ""; $("#qcount").textContent = ""; render(true);
    });
    app.querySelectorAll("[data-evolved]").forEach(b => b.onclick = () => { store.set("evolvedOnly", !store.get("evolvedOnly", false)); render(true); });
    app.querySelectorAll("[data-heart]").forEach(b => b.onclick = () => { store.set("heartOnly", !store.get("heartOnly", false)); render(true); });
    app.querySelectorAll("[data-ronly]").forEach(b => b.onclick = () => { store.set("renderedOnly", !store.get("renderedOnly", false)); render(true); });
    app.querySelectorAll("[data-fset]").forEach(b => b.onclick = () => { store.set(b.dataset.fset, b.dataset.v); render(true); });
    app.querySelectorAll("[data-fsel]").forEach(sl => sl.onchange = () => { store.set(sl.dataset.fsel, sl.value); render(true); });
    app.querySelectorAll("[data-fsel]").forEach(sel => sel.onchange = () => { store.set(sel.dataset.fsel, sel.value); render(true); });
    bindCastBox(app);
    app.querySelectorAll("[data-ftoggle]").forEach(cb => cb.onchange = () => { store.set(cb.dataset.ftoggle, cb.checked); fdropOpen = true; render(true); });
    app.querySelectorAll("[data-unset]").forEach(b => b.onclick = () => {
      const k = b.dataset.unset; store.set(k, FILTER_KEYS.includes(k) ? fdef(k) : "all"); render(true); });
    app.querySelectorAll("details.fdrop").forEach(d => d.ontoggle = () => { fdropOpen = d.open; });
    app.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => { store.set("ovmode", b.dataset.mode); render(); });
    app.querySelectorAll("[data-go]").forEach(c => c.onclick = () => location.hash = c.dataset.go);
    app.querySelectorAll("img[data-grid]").forEach(img => img.onclick = () => {
      const list = [...app.querySelectorAll("img[data-grid]")].map(x => ({src: x.dataset.src, cap: x.dataset.cap}));
      openLB(list, list.findIndex(x => x.src === img.dataset.src));
    });
  }
}
// phone menus: ☰ toggles the header, ⚙ Filters toggles every toolbar (injected into each .toolbar as pages render)
$("#menubtn").onclick = () => { $("header").classList.toggle("open"); syncHdr(); };
const addTbToggles = () => document.querySelectorAll(".toolbar").forEach(tb => {
  if (tb.querySelector(".tbtoggle")) return;
  const b = document.createElement("button"); b.className = "tbtoggle mobonly"; b.textContent = "⚙ Filters";
  b.onclick = e => { e.preventDefault(); document.body.classList.toggle("tbopen"); syncHdr(); };
  tb.prepend(b);
});
new MutationObserver(addTbToggles).observe($("#app"), {childList: true, subtree: true});
const syncHdr = () => { const r = document.documentElement.style, g = document.querySelector(".gnav");
  r.setProperty("--hdr", document.querySelector("header").offsetHeight + "px");
  if (g) r.setProperty("--gnavh", g.offsetHeight + "px"); };
syncHdr(); window.addEventListener("resize", syncHdr);
document.body.classList.toggle("compact", tileSize() < 150);
{
  const q = $("#q"); q.value = store.get("q", "");
  let tmr;
  q.addEventListener("input", () => { clearTimeout(tmr); tmr = setTimeout(() => { store.set("q", q.value); render(); }, 150); });
  let gtmr;
  document.addEventListener("input", e => {
    if (e.target.id !== "gq") return;
    clearTimeout(gtmr);
    gtmr = setTimeout(() => {
      const v = e.target.value, pos = e.target.selectionStart;
      store.set("gq", v); render(true, true);
      const el = $("#gq"); if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch {} }
    }, 150);
  });
  q.addEventListener("keydown", e => { if (e.key === "Escape") { q.value = ""; store.set("q", ""); render(); q.blur(); } });
  document.addEventListener("keydown", e => {
    if (e.key === "/" && !/INPUT|TEXTAREA/.test(document.activeElement?.tagName || "") && !document.querySelector(".overlay.show")) { e.preventDefault(); q.focus(); q.select(); }
  });
}
document.addEventListener("click", e => {  // clicking anywhere outside an open Filters dropdown closes it
  document.querySelectorAll("details.fdrop[open]").forEach(d => { if (!d.contains(e.target)) { d.open = false; fdropOpen = false; } });
  document.querySelectorAll("details.evodd[open]").forEach(d => { if (!d.contains(e.target) || e.target.closest(".evomenu a")) d.open = false; });
});
window.addEventListener("hashchange", () => { document.querySelectorAll(".overlay").forEach(o => o.classList.remove("show")); render(); });
render(); paintPins();
if (canFB) { fbLoad(); cmLoad(); pinLoad(); qLoad(); blLoad(); jLoad(); setInterval(() => { if (document.hidden) return; fbLoad(); cmLoad(); pinLoad(); qLoad(); blLoad(); jLoad(); }, 3000); }
else { $("#qbtn").style.display = "none"; $("#cmbtn").style.display = "none"; }

// live updates: when served over http, poll data.json and redraw in place on change
const live = $("#live");
if (location.protocol.startsWith("http")) {
  let last = JSON.stringify(RAW), stamp = "";
  live.classList.add("on"); live.title = "Auto-updating: new renders appear within a few seconds";
  setInterval(async () => {
    if (document.hidden) return;  // no polling in a background tab
    try {
      // cheap HEAD first: the 2.4 MB data.json is only downloaded + parsed when it actually changed
      const h = await fetch("data.json", {method: "HEAD", cache: "no-store"});
      const st = (h.headers.get("last-modified") || "") + "|" + (h.headers.get("content-length") || "");
      live.classList.add("on");
      if (st && st === stamp) return;
      const txt = JSON.stringify(await (await fetch("data.json", {cache: "no-store"})).json());
      stamp = st;
      if (txt === last) return;
      const next = JSON.parse(txt);
      if (next.ui !== RAW.ui) { if (mediaPlaying()) PENDING_RELOAD = true; else location.reload(); return; }  // gallery code changed
      last = txt; setData(next);
      const y = window.scrollY; render(true); window.scrollTo(0, y);
    } catch { live.classList.remove("on"); live.title = "Gallery server not reachable"; }
  }, 4000);
} else {
  live.style.opacity = .5;
  live.title = "Opened as a file, so no live updates. Run tools/serve_gallery.py and use http://127.0.0.1:8765/gallery/";
}
